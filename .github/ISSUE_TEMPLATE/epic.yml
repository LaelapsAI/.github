name: Epic
description: A larger outcome delivered through several Feature, Task or Bug issues
title: "[Epic] "
type: epic
projects: ["LaelapsAI/9"]
body:
  - type: markdown
    attributes:
      value: |
        The work happens in sub-issues: add them from this issue's sidebar after creating it. Pull requests link the sub-issues, not the epic.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true once every sub-issue is done.
      placeholder: Operators can run night patrols without anyone watching the control desk.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why, and for whom?
      placeholder: Customer pilot with night patrols starts on 2027-02-01.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: How we know the outcome is reached. The sub-issues carry the detailed work.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this epic deliberately leaves out.
    validations:
      required: false
