<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Laelaps AI: field intelligence for critical assets">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeLeft" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#07090c" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#07090c" stop-opacity="0.92"/>
      <stop offset="0.7" stop-color="#07090c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="site">
      <path d="M700 70 L1120 60 L1150 330 L900 370 L680 300 Z"/>
    </clipPath>
  </defs>

  <!-- ground -->
  <rect width="1200" height="420" fill="#07090c"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- site perimeter -->
  <path id="perimeter" d="M700 70 L1120 60 L1150 330 L900 370 L680 300 Z"
        fill="#5eead4" fill-opacity="0.03" stroke="#5eead4" stroke-opacity="0.45"
        stroke-width="1.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- radar -->
  <g clip-path="url(#site)">
    <g transform="translate(900 215)" fill="none" stroke="#5eead4" stroke-opacity="0.12">
      <circle r="60"/><circle r="120"/><circle r="180"/><circle r="240"/>
      <path d="M-260 0H260M0 -260V260"/>
    </g>
    <g transform="translate(900 215)">
      <path d="M0 0 L260 0 A260 260 0 0 0 225.2 -130 Z" fill="url(#sweep)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- camera fields of view -->
  <g fill="#5eead4">
    <polygon fill-opacity="0.08" points="700,70 840,150 790,200">
      <animate attributeName="fill-opacity" values="0.04;0.16;0.04" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon fill-opacity="0.08" points="1150,330 1010,250 1040,320">
      <animate attributeName="fill-opacity" values="0.04;0.16;0.04" dur="3s" begin="1s" repeatCount="indefinite"/>
    </polygon>
    <polygon fill-opacity="0.08" points="1120,60 1010,170 1070,190">
      <animate attributeName="fill-opacity" values="0.04;0.16;0.04" dur="3s" begin="2s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g fill="#07090c" stroke="#5eead4" stroke-width="1.5">
    <rect x="694" y="64" width="12" height="12"/>
    <rect x="1144" y="324" width="12" height="12"/>
    <rect x="1114" y="54" width="12" height="12"/>
  </g>

  <!-- alert -->
  <g transform="translate(960 300)">
    <circle r="4" fill="#ff4d4f"/>
    <circle r="4" fill="none" stroke="#ff4d4f" stroke-width="1.5">
      <animate attributeName="r" values="4;28" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-14" y="-10" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" letter-spacing="1.5" fill="#ff4d4f">PERSON · ZONE B</text>
  </g>

  <!-- patrolling robot -->
  <g>
    <circle r="16" fill="url(#glow)"/>
    <circle r="5" fill="#5eead4"/>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
      <mpath href="#perimeter"/>
    </animateMotion>
  </g>

  <!-- readability fade behind the type -->
  <rect width="1200" height="420" fill="url(#fadeLeft)"/>

  <!-- type -->
  <text x="72" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="10" fill="#f5f7f8">LAELAPS AI</text>
  <text x="76" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="17" letter-spacing="5" fill="#9aa4ad">FIELD INTELLIGENCE FOR CRITICAL ASSETS</text>
  <text x="76" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="3" fill="#5eead4">● EMBODIED<tspan dx="28">● VISUAL</tspan><tspan dx="28">● SENSING</tspan></text>
</svg>
